name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: pytest -q

  dashboard-smoke:
    name: Dashboard render smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install JS deps
        run: npm install playwright chart.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render & validate dashboard
        run: node .claude/skills/run-contract-risk-assessment/smoke.mjs
